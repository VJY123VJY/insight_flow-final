version: "3.9"

services:

  insightflow:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: insightflow

    ports:
      - "8122:8000"

    env_file:
      - .env

    environment:
      - MDU_BASE_URL=http://mock_mdu:8001

    depends_on:
      - mock_mdu

    restart: unless-stopped


  mock_mdu:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: insightflow-mock-mdu

    command: python mock_mdu.py

    expose:
      - "8001"

    env_file:
      - .env

    restart: unless-stopped